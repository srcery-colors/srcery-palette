name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# Grant no default token permissions; each job declares its required scopes.
permissions: {}

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lockfile:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    # contents: read checks out the workflows and their action lockfile.
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.4.1
      - run: gh actions-lock --verify

  zizmor:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    # contents: read checks out the workflows for auditing.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@v0.8.1
        with:
          version: "1.32.0"
          advanced-security: false

  check:
    needs: [lockfile, zizmor]
    runs-on: ubuntu-slim
    timeout-minutes: 10
    # contents: read checks out source for build and packaging.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3.2.0
        env:
          pnpm_config_ignore_scripts: "true"
        with:
          cache: true
          require-lockfile: true
      - run: pnpm build
      - name: Check generated files are committed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
      - run: npm pack --dry-run
