name: Publish to npm

on:
  workflow_dispatch:

# Grant no default token permissions; each job declares its required scopes.
permissions: {}

# Block all cache restores and saves, including pnpm/setup's verification cache.
cache-mode: none

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag
        run: |
          version=$(node -p 'require("./package.json").version')
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "v$version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: publish
    permissions:
      contents: write # Publish the draft release once npm accepts the package.
      id-token: write # Publish with npm OIDC trusted publishing (also signs provenance).
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3.2.0
        env:
          pnpm_config_ignore_scripts: "true"
        with:
          cache: false
          require-lockfile: true
      - run: pnpm build
      - run: pnpm publish --access public --no-git-checks
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false
