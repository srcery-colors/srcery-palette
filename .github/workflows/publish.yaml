name: Publish to npm

on:
  workflow_dispatch:

# Grant no default token permissions; each job declares its required scopes.
permissions: {}

# Block all cache restores and saves, including pnpm/setup's verification cache.
cache-mode: none

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Needed to read draft releases.
    outputs:
      live: ${{ steps.state.outputs.live }}
      draft: ${{ steps.state.outputs.draft }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag
        run: |
          version=$(node -p 'require("./package.json").version')
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "v$version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # Staged versions are not public, so the public registry only lists approved ones.
      - name: Check npm and release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          # Not npm view: devEngines requires pnpm, so npm refuses to run in this checkout.
          packument=$(curl -fsS "https://registry.npmjs.org/${name/\//%2f}")
          live=$(jq --arg v "$version" '.versions | has($v)' <<<"$packument")
          draft=$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          echo "live=$live" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

  publish:
    needs: verify
    if: needs.verify.outputs.live == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: publish
    permissions:
      contents: read
      id-token: write # Stage with npm OIDC trusted publishing (also signs provenance).
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3.2.0
        env:
          pnpm_config_ignore_scripts: "true"
        with:
          cache: false
          require-lockfile: true
      - run: pnpm build
      # The trusted publisher only allows staged publishes; a maintainer approves the version with 2FA.
      - run: pnpm stage publish --access public --no-git-checks
      - run: echo "Staged $GITHUB_REF_NAME. Approve it on npmjs.com, then run this workflow again at the tag to publish the GitHub release." >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: verify
    if: needs.verify.outputs.live == 'true' && needs.verify.outputs.draft == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Publish the draft release.
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false
