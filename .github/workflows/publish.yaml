name: Publish to npm

on:
  workflow_dispatch:

# Grant no default token permissions; each job declares its required scopes.
permissions: {}

# Block all cache restores and saves, including pnpm/setup's verification cache.
cache-mode: none

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write # Needed to read draft releases.
    outputs:
      live: ${{ steps.state.outputs.live }}
      draft: ${{ steps.state.outputs.draft }}
      registry: ${{ steps.state.outputs.registry }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release tag
        run: |
          version=$(node -p 'require("./package.json").version')
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "v$version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      # Staged versions are not public, so the public registry only lists approved ones.
      - name: Check npm and release state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name=$(node -p 'require("./package.json").name')
          version=$(node -p 'require("./package.json").version')
          # Not npm view: devEngines requires pnpm, so npm refuses to run in this checkout.
          registry="https://registry.npmjs.org/${name/\//%2f}"
          packument=$(curl -fsS "$registry")
          live=$(jq --arg v "$version" '.versions | has($v)' <<<"$packument")
          draft=$(gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)
          {
            echo "live=$live"
            echo "draft=$draft"
            echo "registry=$registry"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: verify
    if: needs.verify.outputs.live == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: publish
    permissions:
      contents: read
      id-token: write # Stage with npm OIDC trusted publishing (also signs provenance).
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@v3.2.0
        env:
          pnpm_config_ignore_scripts: "true"
        with:
          cache: false
          require-lockfile: true
      - run: pnpm build
      # The trusted publisher only allows staged publishes; a maintainer approves the version with 2FA.
      - run: pnpm stage publish --access public --no-git-checks
      - run: echo "Staged $GITHUB_REF_NAME. Approve it on npmjs.com within 2 hours; the release job then publishes the GitHub release." >> "$GITHUB_STEP_SUMMARY"

  release:
    needs: [verify, publish]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.verify.outputs.draft == 'true' && (needs.verify.outputs.live == 'true' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 125
    permissions:
      contents: write # Publish the draft release.
    steps:
      # Failing here is the reminder: approve on npmjs.com, then run this workflow again at the tag.
      - name: Wait for npm approval (up to 2 hours)
        env:
          REGISTRY_URL: ${{ needs.verify.outputs.registry }}
        run: |
          version=${GITHUB_REF_NAME#v}
          while (( SECONDS < 7200 )); do
            if curl -fsS "$REGISTRY_URL" | jq -e --arg v "$version" '.versions | has($v)' >/dev/null; then
              exit 0
            fi
            sleep 30
          done
          echo "::error::$GITHUB_REF_NAME is not live on npm after 2 hours. Approve it on npmjs.com, then run this workflow again at the tag."
          exit 1
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --draft=false
